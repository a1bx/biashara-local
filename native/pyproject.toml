[project]
name = "biashara"
version = "0.1.0"
description = "Offline inference, integrity, and benchmarking for Biashara Local."
requires-python = ">=3.11,<3.14"
dependencies = [
    "llama-cpp-python>=0.3.2,<0.4",
    "cryptography>=43,<44",
    "psutil>=5.9,<6",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "sse-starlette>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "nuitka>=2.4,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["biashara*"]

[project.scripts]
biashara-bench = "biashara.bench.harness:main"
biashara-manifest = "biashara.scripts.build_manifest:main"
